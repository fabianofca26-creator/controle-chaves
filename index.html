<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2740">
<title>Chaves da Obra</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --line:#e3e5ea; --line2:#cfd3db;
  --tx:#161a20; --tx2:#5d646f; --tx3:#8b929d;
  --ac:#0f2740; --ac-tx:#fff;
  --ok-bg:#e7f4ea; --ok-tx:#1d5b30;
  --wa-bg:#fdf0d9; --wa-tx:#7a5106;
  --er-bg:#fbe9e9; --er-tx:#8f2020;
  --r:12px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#101317; --card:#181c22; --line:#272c34; --line2:#39404a;
    --tx:#eceef2; --tx2:#a3abb7; --tx3:#767e8a;
    --ac:#dbe4f0; --ac-tx:#0f1621;
    --ok-bg:#16301f; --ok-tx:#8fd6a4;
    --wa-bg:#33270f; --wa-tx:#f0c476;
    --er-bg:#331818; --er-tx:#f0a0a0;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:30px}
h1,h2,h3{font-weight:600;margin:0}
button{font:inherit;color:inherit}
.wrap{max-width:520px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 10px;display:flex;align-items:center;gap:10px}
header .t{flex:1;min-width:0}
header h1{font-size:17px;line-height:1.2}
header p{margin:0;font-size:12px;color:var(--tx3)}
.icobtn{background:none;border:0;padding:6px 10px;border-radius:9px;color:var(--tx2);cursor:pointer;font-size:20px;line-height:1}
.icobtn:active{background:var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.click{cursor:pointer}
.card.click:active{background:var(--line)}
label{display:block;font-size:12px;color:var(--tx2);margin:0 0 5px}
input,select,textarea{width:100%;font:inherit;background:var(--card);color:var(--tx);border:1px solid var(--line2);border-radius:10px;padding:11px 12px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
.field{margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.row>.n{flex:none}
.btn{width:100%;background:var(--ac);color:var(--ac-tx);border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:600;cursor:pointer}
.btn:active{opacity:.85}
.btn:disabled{opacity:.4}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--line2);font-weight:400;padding:11px}
.btn.sm{width:auto;padding:11px 14px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;padding:4px 9px;border-radius:999px;background:var(--ok-bg);color:var(--ok-tx)}
.chip.out{background:var(--wa-bg);color:var(--wa-tx)}
.ck{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;color:var(--tx)}
.ck:last-child{border-bottom:0}
.ck input{width:22px;height:22px;flex:none;margin:0}
.ck .lb{flex:1}
.ck .st{font-size:12px;color:var(--tx3)}
.ck .st.out{color:var(--wa-tx)}
.hist{font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:0}
.hist small{display:block;color:var(--tx3);font-size:12px}
.muted{color:var(--tx3);font-size:13px}
.empty{text-align:center;color:var(--tx3);padding:40px 0}
.hide{display:none}
h2{font-size:15px;margin:18px 0 8px;color:var(--tx2)}
dialog{border:0;border-radius:var(--r);padding:18px;width:min(92vw,480px);background:var(--card);color:var(--tx)}
dialog::backdrop{background:rgba(0,0,0,.45)}
</style>
</head>
<body>
<div class="wrap">

<!-- LISTA -->
<div id="vLista">
  <header>
    <div class="t"><h1>Chaves da Obra</h1><p id="resumo"></p></div>
    <button class="icobtn" onclick="dlgBackup.showModal()" title="Backup">⋮</button>
  </header>
  <div class="row" style="margin-bottom:12px">
    <input id="busca" placeholder="Buscar casa ou pessoa" oninput="render()">
    <button class="btn sm n" onclick="novaCasa()">+ Casa</button>
  </div>
  <div id="casas"></div>
</div>

<!-- DETALHE -->
<div id="vCasa" class="hide">
  <header>
    <button class="icobtn" onclick="abrirLista()">‹</button>
    <div class="t"><h1 id="cTitulo"></h1><p id="cSub"></p></div>
    <button class="icobtn" onclick="menuCasa()" title="Opções">⋮</button>
  </header>
  <div class="card" id="cChaves"></div>
  <div class="row">
    <button class="btn" onclick="abrirEntrega()">Entregar</button>
    <button class="btn sec" id="btDev" onclick="abrirDevolucao()">Devolver</button>
  </div>
  <h2>Histórico</h2>
  <div class="card" id="cHist"></div>
</div>

</div>

<dialog id="dlgMov">
  <form method="dialog" onsubmit="salvarMov(event)">
    <h3 id="mTitulo" style="margin-bottom:12px"></h3>
    <div id="mChaves" style="margin-bottom:12px"></div>
    <div class="field" id="mPessoaW"><label>Para quem</label><input id="mPessoa" list="pessoas" autocomplete="off"><datalist id="pessoas"></datalist></div>
    <div class="field"><label>Data</label><input id="mData" type="date" required></div>
    <div class="field"><label>Observação</label><input id="mObs"></div>
    <div class="row"><button class="btn sec" type="button" onclick="dlgMov.close()">Cancelar</button><button class="btn">Salvar</button></div>
  </form>
</dialog>

<dialog id="dlgBackup">
  <h3 style="margin-bottom:12px">Backup</h3>
  <p class="muted" id="bkInfo"></p>
  <button class="btn" onclick="exportar()">Exportar</button>
  <div style="height:8px"></div>
  <button class="btn sec" onclick="fImp.click()">Importar</button>
  <input id="fImp" type="file" accept=".json" class="hide" onchange="importar(this.files[0])">
  <div style="height:8px"></div>
  <button class="btn sec" onclick="dlgBackup.close()">Fechar</button>
</dialog>

<script>
// ---------- dados ----------
// casa: {id, nome, chaves:[{id, nome, com:null|pessoa, desde:data}], hist:[{data, tipo:'entrega'|'devolucao', pessoa, chaves:[nome], obs}]}
const K = "chaves-obra";
let db = JSON.parse(localStorage.getItem(K) || '{"casas":[],"portas":["Frente","Fundos"],"backup":null}');
const save = () => localStorage.setItem(K, JSON.stringify(db));
const uid = () => Math.random().toString(36).slice(2, 9);
const hoje = () => new Date().toISOString().slice(0, 10);
const fmt = d => d ? d.split("-").reverse().join("/") : "";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let atual = null;

// ---------- lista ----------
function render() {
  const q = busca.value.trim().toLowerCase();
  const fora = db.casas.flatMap(c => c.chaves.filter(k => k.com));
  resumo.textContent = `${db.casas.length} casa(s) · ${fora.length} chave(s) fora`;
  const lista = db.casas.filter(c => !q || c.nome.toLowerCase().includes(q) || c.chaves.some(k => k.com && k.com.toLowerCase().includes(q)));
  casas.innerHTML = lista.length ? lista.map(c => `
    <div class="card click" onclick="abrirCasa('${c.id}')">
      <b>${esc(c.nome)}</b>
      <div class="chips">${c.chaves.map(k => `<span class="chip ${k.com ? "out" : ""}">${esc(k.nome)}${k.com ? " · " + esc(k.com) : ""}</span>`).join("")}</div>
    </div>`).join("") : `<div class="empty">Nenhuma casa. Toque em "+ Casa".</div>`;
  pessoas.innerHTML = [...new Set(db.casas.flatMap(c => c.hist.map(h => h.pessoa)).filter(Boolean))].map(p => `<option value="${esc(p)}">`).join("");
}

function novaCasa() {
  const nome = prompt("Nome ou número da casa:");
  if (!nome) return;
  const chaves = db.portas.flatMap(p => [1, 2].map(n => ({ id: uid(), nome: `${p} ${n}`, com: null, desde: null })));
  db.casas.push({ id: uid(), nome: nome.trim(), chaves, hist: [] });
  save(); render();
}

function abrirLista() { atual = null; vCasa.classList.add("hide"); vLista.classList.remove("hide"); render(); }

// ---------- detalhe ----------
function abrirCasa(id) {
  atual = db.casas.find(c => c.id === id);
  vLista.classList.add("hide"); vCasa.classList.remove("hide");
  renderCasa();
}

function renderCasa() {
  const c = atual;
  cTitulo.textContent = c.nome;
  const fora = c.chaves.filter(k => k.com);
  cSub.textContent = fora.length ? `${fora.length} de ${c.chaves.length} fora` : "Todas as chaves na obra";
  btDev.disabled = !fora.length;
  cChaves.innerHTML = c.chaves.map(k => `
    <div class="ck"><span class="lb">${esc(k.nome)}</span>
      <span class="st ${k.com ? "out" : ""}">${k.com ? `com ${esc(k.com)} desde ${fmt(k.desde)}` : "na obra"}</span></div>`).join("");
  cHist.innerHTML = c.hist.length ? c.hist.map(h => `
    <div class="hist">${h.tipo === "entrega" ? "Entregue a" : "Devolvida por"} <b>${esc(h.pessoa)}</b>: ${h.chaves.map(esc).join(", ")}
      <small>${fmt(h.data)}${h.obs ? " · " + esc(h.obs) : ""}</small></div>`).join("") : `<span class="muted">Sem movimentações.</span>`;
}

function menuCasa() {
  const op = prompt("1 = renomear casa\n2 = adicionar chave\n3 = excluir casa");
  if (op === "1") { const n = prompt("Novo nome:", atual.nome); if (n) { atual.nome = n.trim(); save(); renderCasa(); } }
  if (op === "2") { const n = prompt("Nome da chave (ex: Portão 1):"); if (n) { atual.chaves.push({ id: uid(), nome: n.trim(), com: null, desde: null }); save(); renderCasa(); } }
  if (op === "3" && confirm(`Excluir "${atual.nome}" e todo o histórico?`)) { db.casas = db.casas.filter(c => c !== atual); save(); abrirLista(); }
}

// ---------- movimentação ----------
let modo = "entrega";
function abrirMov(tipo, chaves, marcadas) {
  modo = tipo;
  mTitulo.textContent = tipo === "entrega" ? "Entregar chaves" : "Devolver chaves";
  mPessoaW.classList.toggle("hide", tipo !== "entrega");
  mPessoa.value = ""; mObs.value = ""; mData.value = hoje();
  mChaves.innerHTML = chaves.map(k => `
    <label class="ck"><input type="checkbox" value="${k.id}" ${marcadas.includes(k) ? "checked" : ""}>
      <span class="lb">${esc(k.nome)}</span><span class="st">${k.com ? "com " + esc(k.com) : ""}</span></label>`).join("");
  dlgMov.showModal();
}

function abrirEntrega() {
  const livres = atual.chaves.filter(k => !k.com);
  if (!livres.length) return alert("Nenhuma chave disponível.");
  // ponytail: pré-marca 1 de cada porta (nome sem o número final); o resto é ajuste manual
  const porta = k => k.nome.replace(/\s*\d+$/, "");
  const marcadas = livres.filter((k, i) => livres.findIndex(o => porta(o) === porta(k)) === i);
  abrirMov("entrega", livres, marcadas);
}

function abrirDevolucao() {
  const fora = atual.chaves.filter(k => k.com);
  abrirMov("devolucao", fora, fora);
}

function salvarMov(e) {
  e.preventDefault();
  const ids = [...mChaves.querySelectorAll("input:checked")].map(i => i.value);
  if (!ids.length) return alert("Marque pelo menos uma chave.");
  const pessoa = mPessoa.value.trim();
  if (modo === "entrega" && !pessoa) return alert("Informe para quem.");
  const sel = atual.chaves.filter(k => ids.includes(k.id));
  // devolução pode misturar chaves de pessoas diferentes: um registro por pessoa
  const grupos = modo === "entrega" ? { [pessoa]: sel } : Object.groupBy(sel, k => k.com);
  for (const [p, ks] of Object.entries(grupos)) {
    atual.hist.unshift({ data: mData.value, tipo: modo, pessoa: p, chaves: ks.map(k => k.nome), obs: mObs.value.trim() });
    ks.forEach(k => { k.com = modo === "entrega" ? pessoa : null; k.desde = modo === "entrega" ? mData.value : null; });
  }
  save(); dlgMov.close(); renderCasa();
}

// ---------- backup ----------
dlgBackup.addEventListener("toggle", () => {
  bkInfo.textContent = db.backup ? `Último backup: ${fmt(db.backup)}` : "Nunca fez backup.";
});
function exportar() {
  db.backup = hoje(); save();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(db)], { type: "application/json" }));
  a.download = `chaves-obra-${hoje()}.json`; a.click();
  dlgBackup.close();
}
function importar(f) {
  if (!f || !confirm("Substituir todos os dados pelo backup?")) return;
  f.text().then(t => { const d = JSON.parse(t); if (!Array.isArray(d.casas)) throw 0; db = d; save(); dlgBackup.close(); abrirLista(); })
    .catch(() => alert("Arquivo inválido."));
}

render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
